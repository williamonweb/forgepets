<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#221047" />
  <title>ForgePets Master — Administração SaaS</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <div id="masterApp" class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <img src="/forgepets-logo.png" alt="ForgePets" />
        <span>MASTER</span>
      </div>
      <nav id="masterNav" aria-label="Navegação principal"></nav>
      <div class="admin-owner">
        <span class="owner-avatar">WG</span>
        <div><b>William Gomes</b><small>Proprietário</small></div>
        <button data-action="master-logout" title="Sair">↪</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="title-wrap">
          <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menu">☰</button>
          <div><h1 id="masterTitle">Visão geral</h1><p id="masterSubtitle">Acompanhe o desempenho real do ForgePets</p></div>
        </div>
        <div class="admin-top-actions">
          <div class="admin-search">⌕ <input id="masterSearch" placeholder="Buscar empresa, responsável ou CNPJ..." /></div>
          <button class="icon-btn" data-action="refresh" title="Atualizar">↻</button>
          <button class="icon-btn" data-action="admin-notifications" title="Notificações">🔔<b id="notificationCount">0</b></button>
          <button class="primary" data-action="new-company">＋ Nova empresa</button>
        </div>
      </header>
      <section id="masterContent" class="admin-content"></section>
    </main>
  </div>
  <div id="adminModalRoot"></div>
  <div id="adminToastRoot" class="admin-toast-root"></div>
  <script src="/admin.js" defer></script>
</body>
</html>
